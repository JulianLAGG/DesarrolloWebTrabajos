<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Clase 4 - Cards</title>
        <style>
            .bar-top {
                max-width: 1000px;
                margin: 15px auto 5px auto;
                padding: 0 20px;
            }
            .btn-volver {
                display: inline-block;
                padding: 8px 16px;
                background-color: #2d3748;
                color: #ffffff;
                text-decoration: none;
                border-radius: 4px;
                font-size: 0.9rem;
                font-weight: bold;
                transition: background-color 0.2s ease;
            }
            .btn-volver:hover {
                background-color: #b3b492;
                color: #1a1a1a;
            }
        </style>
    </head>
    <body>
        <div class="bar-top">
            <a href="../index.html" class="btn-volver"
                >← Volver al Menú Principal</a
            >
        </div>

        <div class="Contenedor">
            <section class="caja">
                <div class="img-box">
                    <img src="img/zapatillas.jpeg" alt="Zapatillas" />
                </div>
                <h2>Zapatillas</h2>
                <p>Zapatillas Zapatillas Zapatillas Zapatillas</p>
                <p class="precio">$120.999</p>
                <div class="estrellas">★★★★★</div>
                <button class="btn btn-celeste">Comprar</button>
            </section>

            <section class="caja">
                <div class="img-box">
                    <img src="img/reloj2.jpeg" alt="Reloj" />
                </div>
                <h2>Reloj</h2>
                <p>Reloj Reloj Reloj Reloj Reloj</p>
                <p class="precio">$74.999</p>
                <div class="estrellas">★★★★★</div>
                <button class="btn btn-violeta">Comprar</button>
            </section>

            <section class="caja">
                <div class="img-box">
                    <img src="img/auriculares.jpeg" alt="Auriculares" />
                </div>
                <h2>Auriculares</h2>
                <p>Auriculares Auriculares Auriculares Auriculares</p>
                <p class="precio">$99.999</p>
                <div class="estrellas">★★★★★</div>
                <button class="btn btn-negro">Comprar</button>
            </section>

            <section class="caja">
                <div class="img-box">
                    <img src="img/joystick.jpeg" alt="Joystick" />
                </div>
                <h2>Joystick</h2>
                <p>Joystick Joystick Joystick Joystick</p>
                <p class="precio">$79.999</p>
                <div class="estrellas">★★★★★</div>
                <button class="btn btn-naranja">Comprar</button>
            </section>
        </div>
    </body>
</html>
